name: Flutter verification

# The unit tests prove the generated Dart is structurally sound (balanced braces, one `child:`
# per call, no `await` inside setState). Only the Dart analyzer can prove it compiles. This
# workflow generates each example, drops it into a real Flutter app and runs `dart analyze` plus a
# widget test, so a codegen change that produces non-compiling Dart fails here.
#
# Both steps surface their findings as `::error::` annotations. That is not decoration: annotations
# are readable through the API even when job logs are not, and without them a red check that says
# "exit code 3" is not actionable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: generate + analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: npm ci
      - run: npm run build
      - run: flutter --version

      - name: Generate every example
        run: npm run examples

      - name: Analyze the generated Dart inside a real Flutter app
        run: |
          set -uo pipefail
          if ! flutter create --project-name verify_app --org dev.plainui verify > /tmp/create.log 2>&1; then
            tail -40 /tmp/create.log
            echo "::error title=flutter create::flutter create failed, see the log above"
            exit 1
          fi
          cd verify

          # Each example keeps its own directory: generated files import their siblings, so
          # they must stay together.
          mkdir -p lib/counter lib/todo lib/gallery lib/async lib/navigation lib/forms lib/demo lib/model
          cp ../examples/counter/lib/generated/*.dart lib/counter/
          cp ../examples/todo/lib/generated/*.dart lib/todo/
          cp ../examples/gallery/lib/generated/*.dart lib/gallery/
          # Navigation: two screens in two files plus the project route table, which imports both.
          cp ../examples/navigation/lib/generated/*.dart lib/navigation/
          # Forms: two screens that validate before their handlers run.
          cp ../examples/forms/lib/generated/*.dart lib/forms/
          # The async example awaits a real host function; the generated file imports it as
          # `../data.dart`, so the host module lands one level up from the generated file.
          cp ../examples/async/lib/generated/*.dart lib/async/
          cp ../examples/async/lib/data.dart lib/data.dart
          # The demo is the phase gate: every screen, the theme, the loads, the forms and the
          # navigation are `.pui`. Its host module owns a model class, so it lives in `lib/model`
          # and the generated files reach it as `../model/data.dart`.
          cp ../examples/demo/lib/generated/*.dart lib/demo/
          cp ../examples/demo/lib/model/data.dart lib/model/data.dart

          cat > lib/verify.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'async/async.pui.dart';
          import 'async/race.pui.dart';
          import 'counter/counter.pui.dart';
          import 'todo/todo.pui.dart';
          import 'gallery/gallery.pui.dart';
          import 'navigation/detail.pui.dart' as navigation_detail;
          import 'navigation/home.pui.dart' as navigation_home;
          import 'forms/signup.pui.dart' as forms_signup;
          import 'forms/profile.pui.dart' as forms_profile;
          import 'demo/inbox.pui.dart' as demo_inbox;
          import 'demo/detail.pui.dart' as demo_detail;
          import 'demo/new_issue.pui.dart' as demo_new_issue;

          /// Instantiates every generated screen. If the generated constructors or widget trees
          /// are wrong, this file does not compile.
          List<Widget> screens() => <Widget>[
                const Counter(),
                const Todo(),
                const Gallery(),
                const Async(),
                const Race(),
                const navigation_home.Home(),
                // A screen with parameters: the constructor is generated from the parameter list.
                const navigation_detail.Detail(id: '1'),
                const forms_signup.Signup(),
                const forms_profile.Profile(),
                const demo_inbox.Inbox(),
                const demo_detail.Detail(id: 'pui-1'),
                const demo_new_issue.NewIssue(),
              ];

          void main() => runApp(const MaterialApp(home: _Screens()));

          class _Screens extends StatelessWidget {
            const _Screens();

            @override
            Widget build(BuildContext context) => Column(children: screens());
          }
          DART

          # Generated code is machine written, so lint opinions about it are not interesting;
          # errors and warnings are.
          # `run:` steps execute with `bash -e`, so a non-zero exit would end the step before the
          # findings could be captured. `|| status=$?` keeps the status and the output.
          status=0
          dart analyze --fatal-warnings lib/counter lib/todo lib/gallery lib/async lib/navigation lib/forms lib/demo lib/data.dart lib/model/data.dart lib/verify.dart \
            > /tmp/analyze.log 2>&1 || status=$?
          cat /tmp/analyze.log
          if [ "$status" -ne 0 ]; then
            # Annotations are reachable through the API when job logs are not. Emit the findings
            # themselves when the output has the usual shape, and the first lines of the log
            # otherwise, so a failure is never just "exit code 3".
            findings=$(grep -cE '^[[:space:]]+(error|warning)[[:space:]]+•' /tmp/analyze.log || true)
            if [ "$findings" -gt 0 ]; then
              grep -E '^[[:space:]]+(error|warning)[[:space:]]+•' /tmp/analyze.log | head -30 \
                | while IFS= read -r line; do
                    echo "::error title=dart analyze::$(echo "$line" | sed -e 's/^[[:space:]]*//')"
                  done
            else
              head -30 /tmp/analyze.log | while IFS= read -r line; do
                echo "::error title=dart analyze log::${line}"
              done
            fi
            exit "$status"
          fi

      - name: Widget test
        run: |
          set -uo pipefail
          cd verify
          mkdir -p test
          cat > test/generated_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:verify_app/async/async.pui.dart' as async_example;
          import 'package:verify_app/counter/counter.pui.dart' as counter;
          import 'package:verify_app/todo/todo.pui.dart' as todo;
          import 'package:verify_app/navigation/home.pui.dart' as navigation_home;
          import 'package:verify_app/navigation/plainui_routes.dart';
          import 'package:verify_app/async/race.pui.dart' as race_example;
          import 'package:verify_app/forms/signup.pui.dart' as forms_signup;
          import 'package:verify_app/forms/profile.pui.dart' as forms_profile;
          import 'package:verify_app/demo/inbox.pui.dart' as demo_inbox;
          import 'package:verify_app/demo/detail.pui.dart' as demo_detail;
          import 'package:verify_app/demo/new_issue.pui.dart' as demo_new_issue;

          void main() {
            testWidgets('the counter renders and reacts to a tap', (tester) async {
              // `MaterialApp` alone is not a Material ancestor; TextField says so loudly.
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: counter.Counter())));
              // The screen renders `text "Hello, ${name}"` with name starting as "PlainUI".
              expect(find.text('Hello, PlainUI'), findsOneWidget);
              expect(find.text('Taps so far'), findsOneWidget);

              await tester.tap(find.text('One more'));
              await tester.pumpAndSettle();
              expect(find.text('1'), findsWidgets);
            });

            testWidgets('a derived value recomputes, and unrelated state leaves it alone',
                (tester) async {
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: counter.Counter())));

              // `derived doubled = count * 2`, read in a Text — computed for the first build.
              expect(find.text('x2 = 0'), findsOneWidget);

              await tester.tap(find.text('One more'));
              await tester.pumpAndSettle();
              expect(find.text('1'), findsWidgets);
              expect(find.text('x2 = 2'), findsOneWidget);

              // Typing a name changes state the derived value does not read. The screen rebuilds,
              // and the computed value is still the right one — because there is nothing stored
              // that could have gone stale.
              await tester.enterText(find.byType(TextField), 'Ada');
              await tester.pumpAndSettle();
              expect(find.text('Hello, Ada'), findsOneWidget);
              expect(find.text('x2 = 2'), findsOneWidget);
            });

            testWidgets('an effect runs on mount and when the state it names changes',
                (tester) async {
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: counter.Counter())));
              await tester.pumpAndSettle();

              // `effect on count:` — the first run is scheduled after the first frame, which is what
              // `useEffect` and `LaunchedEffect` do too.
              expect(find.text('last: count is 0'), findsOneWidget);

              await tester.tap(find.text('One more'));
              await tester.pumpAndSettle();
              expect(find.text('last: count is 1'), findsOneWidget);

              // Typing changes state the effect does not name.
              await tester.enterText(find.byType(TextField), 'Ada');
              await tester.pumpAndSettle();
              expect(find.text('Hello, Ada'), findsOneWidget);
              expect(find.text('last: count is 1'), findsOneWidget);
            });

            testWidgets('a task loads its value and shows it', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: async_example.Async())));

              // Before the future completes the task reports loading — nobody wrote that flag.
              expect(find.text('Loading…'), findsOneWidget);

              // Advance past the host function's delay, then rebuild with the value it returned.
              await tester.pump(const Duration(milliseconds: 300));
              await tester.pump();

              expect(find.text('Ship it'), findsOneWidget);
              expect(find.text('Write the spec'), findsOneWidget);
              expect(find.text('Loading…'), findsNothing);
            });

            testWidgets('the todo screen renders its list', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: todo.Todo())));
              expect(find.text('Today'), findsOneWidget);
              expect(find.text('Write the spec'), findsOneWidget);
            });

            testWidgets('a retry wins over the older load it superseded', (tester) async {
              // The host function is slow on its first call and fast afterwards, so tapping Retry
              // immediately means the second load finishes first and the first finishes last.
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: race_example.Race())));
              expect(find.text('Loading…'), findsOneWidget);

              await tester.tap(find.text('Retry'));
              await tester.pump(const Duration(milliseconds: 40));
              expect(find.text('fresh result'), findsOneWidget);

              // 500ms later the first, slower load completes. Without the sequence number it would
              // overwrite the fresh result and the screen would show stale data for good.
              await tester.pump(const Duration(milliseconds: 500));
              expect(find.text('fresh result'), findsOneWidget);
              expect(find.text('stale result'), findsNothing);
            });

            testWidgets('navigate opens a screen with arguments, back() returns', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: navigation_home.Home()));
              expect(find.text('Tasks'), findsOneWidget);

              // `on tap: navigate Detail(id: "1", title: item)` — a real push with arguments.
              await tester.tap(find.text('Ship it'));
              await tester.pumpAndSettle();

              expect(find.text('Item 1'), findsOneWidget);
              expect(find.text('Ship it'), findsOneWidget); // the title parameter

              // `on tap: back()` — a real pop, back on the list.
              await tester.tap(find.text('Back'));
              await tester.pumpAndSettle();
              expect(find.text('Tasks'), findsOneWidget);
              expect(find.text('Item 1'), findsNothing);
            });

            testWidgets('a form validates before its handler runs', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: forms_signup.Signup())));

              // submit() validates, fails, and the handler is skipped — the handler is inside the
              // `if`, so there is no path that reaches it without validating first.
              await tester.tap(find.text('Create account'));
              await tester.pumpAndSettle();
              expect(find.text('Welcome, alice'), findsNothing);
              expect(find.text('This field is required'), findsNWidgets(3));

              // The validator that is not `required` reports its own message.
              await tester.enterText(find.byType(TextFormField).at(0), 'not-an-email');
              await tester.enterText(find.byType(TextFormField).at(1), 'alice');
              await tester.enterText(find.byType(TextFormField).at(2), 'hunter2!');
              await tester.tap(find.text('Create account'));
              await tester.pumpAndSettle();
              expect(find.text('Enter a valid email address'), findsOneWidget);
              expect(find.text('Welcome, alice'), findsNothing);

              // Every rule satisfied: the same tap now runs the handler.
              await tester.enterText(find.byType(TextFormField).at(0), 'alice@example.com');
              await tester.tap(find.text('Create account'));
              await tester.pumpAndSettle();
              expect(find.text('Welcome, alice'), findsOneWidget);
            });

            testWidgets('an optional field passes when it is empty', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: Scaffold(body: forms_profile.Profile())));

              // Neither field is `required`, so empty input is valid and the handler runs.
              await tester.tap(find.text('Save'));
              await tester.pumpAndSettle();
              expect(find.text('Saved.'), findsOneWidget);

              // Once something is typed, the rule applies to it.
              await tester.enterText(find.byType(TextFormField).at(0), '123');
              await tester.tap(find.text('Save'));
              await tester.pumpAndSettle();
              expect(find.text('Enter a value in the expected format'), findsOneWidget);
            });

            testWidgets('the demo loads a keyed list and filters it through an effect', (tester) async {
              // A demo screen is a page: it renders its own `scaffold`, so `MaterialApp` is enough.
              await tester.pumpWidget(const MaterialApp(home: demo_inbox.Inbox()));

              // `task issues: List<Issue> = data.loadIssues(filter)` — the list arrives on its own.
              await tester.pump(const Duration(milliseconds: 200));
              await tester.pump();
              expect(find.text('4 issues'), findsOneWidget);
              expect(find.text('Derive instead of storing'), findsOneWidget);
              expect(find.text('Validate before the handler runs'), findsOneWidget);

              // Typing changes `filter`; `effect on filter: issues.retry()` re-runs the load, and the
              // older request in flight is dropped rather than allowed to answer last.
              await tester.enterText(find.byType(TextField), 'deriv');
              await tester.pump(); // the effect is scheduled after this frame
              await tester.pump(const Duration(milliseconds: 200)); // the retry's delay
              await tester.pump();

              expect(find.text('1 matching'), findsOneWidget);
              expect(find.text('Derive instead of storing'), findsOneWidget);
              expect(find.text('Validate before the handler runs'), findsNothing);
            });

            testWidgets('the demo opens a detail screen and gates its comment form', (tester) async {
              await tester.pumpWidget(const MaterialApp(
                home: demo_detail.Detail(id: 'pui-1', title: 'Derive instead of storing'),
              ));
              await tester.pump(const Duration(milliseconds: 200));
              await tester.pump();

              expect(find.text('2 comments'), findsOneWidget);
              expect(find.text('Computed, so it cannot be stale.'), findsOneWidget);

              // An empty comment: submit() validates, fails, and the handler is skipped.
              await tester.tap(find.text('Post'));
              await tester.pumpAndSettle();
              expect(find.text('Posted'), findsNothing);
              expect(find.text('This field is required'), findsOneWidget);

              await tester.enterText(find.byType(TextFormField), 'Seconded');
              await tester.tap(find.text('Post'));
              await tester.pumpAndSettle();
              await tester.pump(const Duration(milliseconds: 200)); // `await addComment(id, note)`
              await tester.pump(const Duration(milliseconds: 200)); // `comments.retry()`
              await tester.pump();

              expect(find.text('Posted'), findsOneWidget);
              expect(find.text('Seconded'), findsOneWidget);
            });

            testWidgets('the demo creates an issue and lands back on the list', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: demo_new_issue.NewIssue()));

              await tester.tap(find.text('Create'));
              await tester.pumpAndSettle();
              expect(find.text('This field is required'), findsOneWidget);

              await tester.enterText(find.byType(TextFormField).at(0), 'Ship the demo');
              await tester.tap(find.text('Create'));
              await tester.pumpAndSettle();
              await tester.pump(const Duration(milliseconds: 200)); // `await createIssue(...)`
              await tester.pumpAndSettle();
              await tester.pump(const Duration(milliseconds: 200)); // the new Inbox loads
              await tester.pump();

              expect(find.text('Ship the demo'), findsOneWidget);
            });

            testWidgets('the route table opens a screen by name', (tester) async {
              // What a deep link does: a name and an argument map, no import of the screen's file
              // at the call site.
              final widget = puiRoutes['Detail']!(<String, Object?>{'id': '7'});
              await tester.pumpWidget(MaterialApp(home: widget));
              expect(find.text('Item 7'), findsOneWidget);
              expect(find.text('Task'), findsOneWidget); // the parameter default
            });
          }
          DART
          status=0
          flutter test test/generated_test.dart > /tmp/test.log 2>&1 || status=$?
          cat /tmp/test.log
          if [ "$status" -ne 0 ]; then
            # Same reasoning as the analyzer step: a failing widget test has to say why. The
            # exception block is the part worth reading, and the head of the log when there is no
            # exception block at all (a compile error in the test file, for instance).
            sed -n '/EXCEPTION CAUGHT BY/,/^$/p' /tmp/test.log | head -30 \
              | while IFS= read -r line; do
                  echo "::error title=flutter test::$(echo "$line" | sed -e 's/^[[:space:]]*//')"
                done
            head -40 /tmp/test.log | while IFS= read -r line; do
              echo "::error title=flutter test log::${line}"
            done
            exit "$status"
          fi

      - name: Upload the generated sources as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-dart
          path: |
            examples/*/lib/generated/*.dart
          if-no-files-found: warn
