<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleDemo</title>
<style>
:root {
  color-scheme: light;
  --pui-bg: #f8fafc;
  --pui-fg: #0f172a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  padding: 24px;
  background: var(--pui-bg);
  color: var(--pui-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.pui-root { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pui-screen { display: flex; flex-direction: column; gap: 12px; }
.pui-conditional, .pui-repeat { display: contents; }
.pui-conditional { outline: 1px dashed rgba(37, 99, 235, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-repeat { outline: 1px dashed rgba(100, 116, 139, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-host, .pui-unknown, .pui-component {
  border: 1px dashed rgba(100, 116, 139, 0.5);
  border-radius: 10px;
  padding: 10px 12px;
  color: #475569;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pui-component { border-color: rgba(37, 99, 235, 0.4); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.pui-empty { color: #64748b; font-style: italic; }

/* design tokens from this file's theme */
:root {
  --pui-surface: #ffffff;
  --pui-ink: #0f172a;
  --pui-brand: #2563eb;
  --pui-line: rgba(0, 0, 0, 0.078);
  --pui-sm: 8px;
  --pui-md: 16px;
  --pui-card: 12px;
}
</style>
</head>
<body>
<main class="pui-root" data-screen="StyleDemo">
  <div class="pui-screen">
    <div class="pui-column" style="display: flex; flex-direction: column; gap: 8px; padding: 16px">
      <div class="pui-card" style="background: #ffffff; border-radius: 12px; padding: 16px; border: 1px solid rgba(0, 0, 0, 0.078); box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.122)">
        <span class="pui-text" style="white-space: pre-wrap; font-size: 20px; font-weight: 700; color: #0f172a">Panel</span>
      </div>
      <div class="pui-card" style="background: #2563eb; border-radius: 12px; padding: 16px; border: 1px solid rgba(0, 0, 0, 0.078); box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.122)">
        <span class="pui-text" style="white-space: pre-wrap; color: #ffffff">Override</span>
      </div>
      <button class="pui-button" type="button" style="font: inherit; border-radius: 10px; padding: 10px 18px; font-size: 20px; font-weight: 700; color: #0f172a; border: 0; background: #2563eb">
        Buy
      </button>
      <div class="pui-component" data-component="Badge" style="padding: 16px; background: #ffffff; border-radius: 12px; border: 1px solid rgba(0, 0, 0, 0.078); box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.122); display: flex; flex-direction: column; gap: 0">
        <span class="pui-text" style="white-space: pre-wrap; font-size: 12px; line-height: 1.33">new</span>
      </div>
      <div class="pui-card" style="background: #ffffff; border-radius: 12px; padding: 16px; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.200)">
        <span class="pui-text" style="white-space: pre-wrap">Inline shadow</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
