<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<style>
:root {
  color-scheme: light;
  --pui-bg: #f8fafc;
  --pui-fg: #0f172a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  padding: 24px;
  background: var(--pui-bg);
  color: var(--pui-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.pui-root { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pui-screen { display: flex; flex-direction: column; gap: 12px; }
.pui-conditional, .pui-repeat { display: contents; }
.pui-conditional { outline: 1px dashed rgba(37, 99, 235, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-repeat { outline: 1px dashed rgba(100, 116, 139, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-host, .pui-unknown, .pui-component {
  border: 1px dashed rgba(100, 116, 139, 0.5);
  border-radius: 10px;
  padding: 10px 12px;
  color: #475569;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pui-component { border-color: rgba(37, 99, 235, 0.4); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.pui-empty { color: #64748b; font-style: italic; }

</style>
</head>
<body>
<main class="pui-root" data-screen="Shop">
  <div class="pui-screen">
    <div class="pui-column" style="display: flex; flex-direction: column; gap: 16px; padding: 20px">
      <span class="pui-text" style="white-space: pre-wrap; font-size: 24px; font-weight: 400; line-height: 1.33">Market</span>
      <label class="pui-field" style="display: flex; flex-direction: column; gap: 4px">
        <input type="text" placeholder="Search" style="font: inherit; padding: 10px 12px; border: 1px solid rgba(15, 23, 42, 0.16); border-radius: 10px; background: #ffffff">
      </label>
      <span class="pui-text" style="white-space: pre-wrap; font-size: 12px; line-height: 1.33">Nothing in the cart yet</span>
      <div class="pui-component" data-component="ProductCard" style="display: flex; flex-direction: column; gap: 0">
        <div class="pui-card" style="background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.06)">
          <div class="pui-column" style="display: flex; flex-direction: column; gap: 8px">
            <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
              <span class="pui-text" style="white-space: pre-wrap; font-size: 16px; font-weight: 500; line-height: 1.5">Coffee</span>
              <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; line-height: 1.43">10 ETB</span>
            </div>
            <hr class="pui-divider" style="border: 0; border-top: 1px solid rgba(15, 23, 42, 0.12); margin: 8px 0">
            <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
              <button class="pui-button" type="button" data-event="tap" style="font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer">
                Add
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="pui-component" data-component="ProductCard" style="display: flex; flex-direction: column; gap: 0">
        <div class="pui-card" style="background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.06)">
          <div class="pui-column" style="display: flex; flex-direction: column; gap: 8px">
            <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
              <span class="pui-text" style="white-space: pre-wrap; font-size: 16px; font-weight: 500; line-height: 1.5">Tea</span>
              <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; line-height: 1.43">15 ETB</span>
            </div>
            <hr class="pui-divider" style="border: 0; border-top: 1px solid rgba(15, 23, 42, 0.12); margin: 8px 0">
            <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
              <button class="pui-button" type="button" data-event="tap" style="font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer">
                Add
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="pui-component" data-component="ProductCard" style="display: flex; flex-direction: column; gap: 0">
        <div class="pui-card" style="background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.06)">
          <div class="pui-column" style="display: flex; flex-direction: column; gap: 8px">
            <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
              <span class="pui-text" style="white-space: pre-wrap; font-size: 16px; font-weight: 500; line-height: 1.5">Juice</span>
              <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; line-height: 1.43">20 ETB</span>
            </div>
            <hr class="pui-divider" style="border: 0; border-top: 1px solid rgba(15, 23, 42, 0.12); margin: 8px 0">
            <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
              <button class="pui-button" type="button" data-event="tap" style="font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer">
                Add
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="pui-grid" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div class="pui-card" style="background: #ffffff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.06)">
          <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; font-weight: 500; line-height: 1.43">Coffee</span>
        </div>
        <div class="pui-card" style="background: #ffffff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.06)">
          <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; font-weight: 500; line-height: 1.43">Tea</span>
        </div>
        <div class="pui-card" style="background: #ffffff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.06)">
          <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; font-weight: 500; line-height: 1.43">Juice</span>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
