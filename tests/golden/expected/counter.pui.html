<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter</title>
<style>
:root {
  color-scheme: light;
  --pui-bg: #f8fafc;
  --pui-fg: #0f172a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  padding: 24px;
  background: var(--pui-bg);
  color: var(--pui-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.pui-root { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pui-screen { display: flex; flex-direction: column; gap: 12px; }
.pui-conditional, .pui-repeat { display: contents; }
.pui-conditional { outline: 1px dashed rgba(37, 99, 235, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-repeat { outline: 1px dashed rgba(100, 116, 139, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-host, .pui-unknown, .pui-component {
  border: 1px dashed rgba(100, 116, 139, 0.5);
  border-radius: 10px;
  padding: 10px 12px;
  color: #475569;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pui-component { border-color: rgba(37, 99, 235, 0.4); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.pui-empty { color: #64748b; font-style: italic; }

</style>
</head>
<body>
<main class="pui-root" data-screen="Counter">
  <div class="pui-screen">
    <div class="pui-column" style="display: flex; flex-direction: column; gap: 16px; justify-content: center; padding: 24px">
      <span class="pui-text" style="white-space: pre-wrap; font-size: 24px; font-weight: 400; line-height: 1.33">Hello, PlainUI</span>
      <span class="pui-text" style="white-space: pre-wrap; font-size: 36px; font-weight: 400; line-height: 1.22">0</span>
      <span class="pui-text" style="white-space: pre-wrap; font-size: 12px; line-height: 1.33">Tickets left</span>
      <div class="pui-row" style="display: flex; flex-direction: row; align-items: center; gap: 12px; justify-content: center">
        <button class="pui-button" type="button" data-event="tap" style="font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer">
          −
        </button>
        <button class="pui-button" type="button" data-event="tap" style="font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer">
          Reset
        </button>
        <button class="pui-button" type="button" data-event="tap" style="font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: #2563eb; color: #ffffff; font-weight: 600; cursor: pointer">
          +
        </button>
      </div>
      <label class="pui-field" style="display: flex; flex-direction: column; gap: 4px; padding: 8px">
        <input type="text" placeholder="Say something" style="font: inherit; padding: 10px 12px; border: 1px solid rgba(15, 23, 42, 0.16); border-radius: 10px; background: #ffffff">
      </label>
      <span class="pui-text" style="white-space: pre-wrap; font-size: 14px; color: #475569; line-height: 1.43"></span>
      <span class="pui-text" style="white-space: pre-wrap; font-size: 20px; font-weight: 700; color: #1d4ed8">0 ETB</span>
    </div>
  </div>
</main>
</body>
</html>
