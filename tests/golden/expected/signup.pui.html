<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup</title>
<style>
:root {
  color-scheme: light;
  --pui-bg: #f8fafc;
  --pui-fg: #0f172a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  padding: 24px;
  background: var(--pui-bg);
  color: var(--pui-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.pui-root { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pui-screen { display: flex; flex-direction: column; gap: 12px; }
.pui-conditional, .pui-repeat { display: contents; }
.pui-conditional { outline: 1px dashed rgba(37, 99, 235, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-repeat { outline: 1px dashed rgba(100, 116, 139, 0.35); outline-offset: 4px; border-radius: 8px; }
.pui-host, .pui-unknown, .pui-component {
  border: 1px dashed rgba(100, 116, 139, 0.5);
  border-radius: 10px;
  padding: 10px 12px;
  color: #475569;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pui-component { border-color: rgba(37, 99, 235, 0.4); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.pui-empty { color: #64748b; font-style: italic; }

</style>
</head>
<body>
<main class="pui-root" data-screen="Signup">
  <div class="pui-screen">
    <div class="pui-column" style="display: flex; flex-direction: column; gap: 12px; padding: 20px">
      <div class="pui-form" data-form="required email min(3) max(16) pattern(&quot;^[a-z0-9_]+$&quot;) min(8)" style="display: flex; flex-direction: column; gap: 12px; margin: 0">
        <div class="pui-column" style="display: flex; flex-direction: column; gap: 8px">
          <span class="pui-text" style="white-space: pre-wrap">Create an account</span>
          <label class="pui-field" style="display: flex; flex-direction: column; gap: 4px">
            <span class="pui-field-label" style="font-size: 12px; font-weight: 600; opacity: 0.7">Email</span>
            <input type="email" required="required" data-validate="required email" style="font: inherit; padding: 10px 12px; border: 1px solid rgba(15, 23, 42, 0.16); border-radius: 10px; background: #ffffff">
          </label>
          <label class="pui-field" style="display: flex; flex-direction: column; gap: 4px">
            <span class="pui-field-label" style="font-size: 12px; font-weight: 600; opacity: 0.7">Username</span>
            <input type="text" required="required" pattern="^[a-z0-9_]+$" data-validate="required min(3) max(16) pattern(&quot;^[a-z0-9_]+$&quot;)" style="font: inherit; padding: 10px 12px; border: 1px solid rgba(15, 23, 42, 0.16); border-radius: 10px; background: #ffffff">
          </label>
          <label class="pui-field" style="display: flex; flex-direction: column; gap: 4px">
            <span class="pui-field-label" style="font-size: 12px; font-weight: 600; opacity: 0.7">Password</span>
            <input type="password" required="required" data-validate="required min(8)" style="font: inherit; padding: 10px 12px; border: 1px solid rgba(15, 23, 42, 0.16); border-radius: 10px; background: #ffffff">
          </label>
          <button class="pui-button" type="button" data-event="tap" style="font: inherit; border-radius: 10px; padding: 10px 18px; font-weight: 600; border: 0; background: #2563eb; color: #ffffff">
            Create account
          </button>
        </div>
      </div>
      <div class="pui-form" data-form="max(80)" style="display: flex; flex-direction: column; gap: 12px; margin: 0">
        <div class="pui-column" style="display: flex; flex-direction: column; gap: 8px">
          <span class="pui-text" style="white-space: pre-wrap">Anything else?</span>
          <label class="pui-field" style="display: flex; flex-direction: column; gap: 4px">
            <span class="pui-field-label" style="font-size: 12px; font-weight: 600; opacity: 0.7">Note</span>
            <textarea rows="3" style="font: inherit; padding: 10px 12px; border: 1px solid rgba(15, 23, 42, 0.16); border-radius: 10px; background: #ffffff">
              
            </textarea>
          </label>
          <button class="pui-button" type="button" data-event="tap" style="font: inherit; border-radius: 10px; padding: 10px 18px; font-weight: 600; border: 0; background: #2563eb; color: #ffffff">
            Send
          </button>
        </div>
      </div>
      <span class="pui-text" style="white-space: pre-wrap; font-size: 12px; line-height: 1.33"></span>
    </div>
  </div>
</main>
</body>
</html>
